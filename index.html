<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/style.css">

</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-mark">Class<span>Ledger</span></span>
    </div>

    <div class="lang-switch" id="langSwitch">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="ar">AR</button>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-page="students" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        <span id="navStudentsLabel"></span>
      </button>
      <button class="nav-item" data-page="calendar" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg>
        <span id="navCalendarLabel"></span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <b id="sideTotal">0</b>
      <span id="sideTotalLabel"></span>
    </div>
  </aside>

  <div class="main-area">
    <header class="page-header">
      <div>
        <h1 id="pageTitle"></h1>
        <p class="page-date" id="pageDate"></p>
      </div>
      <div class="header-actions" id="actionsStudents">
        <button class="btn btn-primary" id="openAddBtn" type="button"></button>
      </div>
      <div class="header-actions" id="actionsCalendar" style="display:none;">
        <button class="btn-icon" id="calPrevBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="btn btn-ghost" id="calTodayBtn" type="button"></button>
        <button class="btn-icon" id="calNextBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- ================= STUDENTS PAGE ================= -->
      <section class="page active" id="page-students">
        <div class="hero">
          <svg class="hero-blob" viewBox="0 0 400 140" preserveAspectRatio="none">
            <circle cx="360" cy="15" r="80" fill="#136CFC" opacity="0.06"/>
            <circle cx="330" cy="95" r="50" fill="#C3F84A" opacity="0.14"/>
            <circle cx="405" cy="115" r="34" fill="#136CFC" opacity="0.10"/>
          </svg>
          <div class="hero-content">
            <h2 id="heroGreeting"></h2>
            <p id="heroText"></p>
          </div>
        </div>

        <div class="stats" id="statsBar"></div>

        <div class="controls">
          <input type="text" class="search-input" id="searchInput">
          <select class="filter-select" id="levelFilter"></select>
        </div>

        <div class="table-wrap" id="tableWrap"></div>
      </section>

      <!-- ================= CALENDAR PAGE ================= -->
      <section class="page" id="page-calendar">
        <div class="calendar-layout">
          <div class="calendar-card">
            <p class="calendar-title" id="calMonthLabel"></p>
            <div class="cal-grid" id="calGrid"></div>
          </div>
          <div class="events-card">
            <h3 id="eventsTitle"></h3>
            <p class="sub" id="eventsSub"></p>
            <div class="legend">
              <span><i style="background:var(--color-primary)"></i><span id="legendStartLabel"></span></span>
              <span><i style="background:var(--color-accent-ink)"></i><span id="legendEndLabel"></span></span>
            </div>
            <div id="eventsList"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- ============ Add/Edit Modal ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <form id="studentForm">
      <input type="hidden" id="studentId">
      <div class="field-row">
        <div class="field"><label id="lblFirstName" for="firstName"></label><input type="text" id="firstName" required></div>
        <div class="field"><label id="lblLastName" for="lastName"></label><input type="text" id="lastName" required></div>
      </div>
      <div class="field"><label id="lblLevel" for="level"></label><select id="level" required></select></div>
      <div class="field-row">
        <div class="field"><label id="lblStartDate" for="startDate"></label><input type="date" id="startDate" required></div>
        <div class="field"><label id="lblEndDate" for="endDate"><span id="lblEndDateText"></span> <span class="optional" id="lblEndDateOptional"></span></label><input type="date" id="endDate"></div>
      </div>
      <div class="field">
        <label id="lblNotes" for="notes"><span id="lblNotesText"></span> <span class="optional" id="lblNotesOptional"></span></label>
        <textarea id="notes" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn"></button>
        <button type="submit" class="btn btn-primary" id="submitBtn"></button>
      </div>
    </form>
  </div>
</div>

<!-- ============ Notes viewer modal ============ -->
<div class="modal-overlay" id="noteModalOverlay">
  <div class="modal" style="max-width:380px;">
    <h2 id="noteModalTitle">Notes</h2>
    <p class="note-view-body" id="noteModalBody"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" id="noteCloseBtn"></button>
    </div>
  </div>
</div>

<script src="JS/script.js"></script>

</body>
</html>
